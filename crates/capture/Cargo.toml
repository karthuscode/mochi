[package]
name = "mochi-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[dependencies]
mochi-privacy = { path = "../privacy" }
fs2 = "=0.4.3"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.26.0"
