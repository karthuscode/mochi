[package]
name = "mochi-learning"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
mochi-domain = { path = "../domain" }
mochi-privacy = { path = "../privacy" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
regex = "=1.13.1"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.26.0"
