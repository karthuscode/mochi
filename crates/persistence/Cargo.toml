[package]
name = "mochi-persistence"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
mochi-capture = { path = "../capture" }
mochi-domain = { path = "../domain" }
mochi-privacy = { path = "../privacy" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.26.0"
