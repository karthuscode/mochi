[package]
name = "mochi-integration"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
libc = "=0.2.189"
fs2 = "=0.4.3"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
toml = "=0.9.12"

[dev-dependencies]
tempfile = "=3.26.0"
