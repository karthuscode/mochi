[package]
name = "mochi-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[lib]
name = "mochi_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
serde = { version = "=1.0.229", features = ["derive"] }
mochi-persistence = { path = "../../../crates/persistence" }
mochi-domain = { path = "../../../crates/domain" }
mochi-capture = { path = "../../../crates/capture" }
mochi-learning = { path = "../../../crates/learning" }
mochi-privacy = { path = "../../../crates/privacy" }
mochi-bridge = { path = "../../../crates/bridge" }
mochi-assembly = { path = "../../../crates/assembly" }
mochi-integration = { path = "../../../crates/integration" }
serde_json = "=1.0.151"
fs2 = "=0.4.3"
libc = "=0.2.189"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow"] }
core-foundation = "=0.10.1"

[dev-dependencies]
tempfile = "=3.26.0"
serde_json = "=1.0.151"
