[package]
name = "mochi-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[lib]
name = "mochi_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
mochi-persistence = { path = "../../../crates/persistence" }

[dev-dependencies]
serde_json = "=1.0.151"
